name: Build iOS (unsigned IPA)

# 수동 실행 전용: Actions 탭 → "Build iOS (unsigned IPA)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Godot 버전 (프로젝트는 3.5 계열)"
        default: "3.5.3"
      bundle_id:
        description: "번들 ID"
        default: "com.mmx8.ios"

env:
  GODOT_VERSION: ${{ github.event.inputs.godot_version }}
  BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
  APP_NAME: MMX8
  APP_DISPLAY_NAME: "MMX8 Zashiko-Mod"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Godot + iOS 내보내기 템플릿 설치
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip      "$BASE/Godot_v${GODOT_VERSION}-stable_osx.universal.zip"
          curl -fL -o templates.tpz  "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          TPL="$HOME/Library/Application Support/Godot/templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL/"
          ls "$TPL" | grep -i iphone
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: 소스 전처리 (iOS 터치 컨트롤 / 텍스처 압축 / 프리셋)
        run: python3 ci/ios_prepare.py

      - name: 불투명 앱스토어 아이콘 생성 + build 폴더 임포트 제외
        run: |
          set -eux
          # Godot iOS 내보내기는 1024 앱스토어 아이콘이 불투명(알파 없음)이어야 함
          # JPEG를 거치면 알파가 사라지므로 다시 PNG로 되돌려 불투명 PNG를 만든다
          sips -s format jpeg -s formatOptions 100 -z 1024 1024 icon.png --out /tmp/icon_opaque.jpg
          sips -s format png /tmp/icon_opaque.jpg --out ci_icon_1024.png
          # 프리셋에 아이콘 값이 적용되지 않는 경우를 대비해 프로젝트 기본 아이콘도 불투명으로 교체
          cp ci_icon_1024.png icon.png
          sips -g hasAlpha -g pixelWidth -g pixelHeight icon.png ci_icon_1024.png
          # 내보내기 결과물이 프로젝트 리소스로 임포트되지 않게 제외
          mkdir -p build/ios
          touch build/.gdignore

      - name: 리소스 임포트
        run: |
          set -x
          # .import 캐시가 없으므로 첫 실행은 임포트만 하고 실패해도 무시
          # (3.5에서는 --editor --quit 가 임포트 전에 종료되므로 --export 로 임포트)
          mkdir -p build/ios
          "$GODOT" --path . --no-window --export "iOS" "$PWD/build/ios/${APP_NAME}.ipa" || true

      - name: Xcode 프로젝트 내보내기
        run: |
          set -eux
          mkdir -p build/ios
          # 임포트가 끝난 상태에서 실제 내보내기
          "$GODOT" --path . --no-window --export "iOS" "$PWD/build/ios/${APP_NAME}.ipa"
          find build/ios -maxdepth 2 | head -40

      - name: 홈 화면 앱 이름 설정
        run: |
          set -eux
          PLIST="build/ios/$APP_NAME/${APP_NAME}-Info.plist"
          test -f "$PLIST"
          for KEY in CFBundleDisplayName CFBundleName; do
            /usr/libexec/PlistBuddy -c "Set :$KEY $APP_DISPLAY_NAME" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :$KEY string $APP_DISPLAY_NAME" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" "$PLIST"

      - name: 무음 모드에서도 소리 나게 (오디오 세션 Playback 패치)
        run: |
          set -eux
          cd build/ios
          PBX="$(ls -d *.xcodeproj | head -1)/project.pbxproj"
          DUMMY="$APP_NAME/dummy.cpp"
          if [ -f "$DUMMY" ] && grep -q 'dummy\.cpp' "$PBX"; then
            # dummy.cpp 를 Objective-C++ (.mm) 로 바꿔서 오디오 세션 코드를 추가
            sed -e '/dummy\.cpp/{s/dummy\.cpp/dummy.mm/g;s/sourcecode\.cpp\.cpp/sourcecode.cpp.objcpp/;}' "$PBX" > /tmp/pbx.new
            grep -q 'dummy\.mm' /tmp/pbx.new
            mv /tmp/pbx.new "$PBX"
            mv "$DUMMY" "$APP_NAME/dummy.mm"
            cat >> "$APP_NAME/dummy.mm" <<'EOF'

            #import <UIKit/UIKit.h>
            #import <AVFoundation/AVFoundation.h>

            static void mmx8_activate_playback_session(void) {
            	AVAudioSession *session = [AVAudioSession sharedInstance];
            	[session setCategory:AVAudioSessionCategoryPlayback error:nil];
            	[session setActive:YES error:nil];
            }

            @interface MMX8AudioSessionHook : NSObject
            @end

            @implementation MMX8AudioSessionHook
            + (void)load {
            	@autoreleasepool {
            		mmx8_activate_playback_session();
            		NSNotificationCenter *nc = [NSNotificationCenter defaultCenter];
            		[nc addObserverForName:UIApplicationDidBecomeActiveNotification object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification *n) {
            			mmx8_activate_playback_session();
            		}];
            		[nc addObserverForName:AVAudioSessionInterruptionNotification object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification *n) {
            			mmx8_activate_playback_session();
            		}];
            		dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
            			mmx8_activate_playback_session();
            		});
            	}
            }
            @end
          EOF
            grep -n 'dummy' "$PBX" | head
          else
            echo "::warning::dummy.cpp 를 찾지 못해 오디오 세션 패치를 건너뜀"
            ls -R . | head -40
          fi

      - name: 서명 없이 빌드 → IPA 패키징
        run: |
          set -euxo pipefail
          XCPROJ="$(find build/ios -maxdepth 2 -name '*.xcodeproj' | head -1)"
          SCHEME="$(basename "$XCPROJ" .xcodeproj)"
          xcodebuild -project "$XCPROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -arch arm64 \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            OTHER_LDFLAGS='$(inherited) -framework AVFoundation' \
            build
          APP="$(find build/dd/Build/Products -maxdepth 2 -name '*.app' -path '*iphoneos*' | head -1)"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error
